name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up signing
        run: |
          echo "KEY_STORE_FILE=$(pwd)/key.jks" > keystore.properties
          echo "KEY_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> keystore.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: wish-export-release
          path: app/build/outputs/apk/release/*.apk
          archive: false
          if-no-files-found: error
